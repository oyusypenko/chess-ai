name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: typecheck · lint · format · test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

  smoke:
    name: cross-origin isolation headers (FR-7)
    runs-on: ubuntu-latest
    # Job-level cap plus per-step caps below: a smoke test that spawns servers
    # can hang instead of failing, and a hang with no timeout burns runner
    # hours and reports nothing useful.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Two layers, because they can fail independently:
      #   1. next.config is correct        → `next start`
      #   2. Cloudflare actually serves it → the real Worker under wrangler
      # Without these headers SharedArrayBuffer is unavailable and multithreaded
      # Stockfish silently degrades to single-threaded (US-C1, NFR-C1) — a
      # regression with no error message, so it gates merge.
      - name: Build (Next.js)
        run: npm run build

      - name: Assert headers from the Next.js server
        timeout-minutes: 3
        run: npm run test:headers

      - name: Build (OpenNext → Cloudflare Worker)
        run: npx opennextjs-cloudflare build

      - name: Assert headers from the Cloudflare Worker
        timeout-minutes: 5
        run: |
          npx wrangler dev --port 8788 --local > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 45); do
            sleep 2
            curl -sf -o /dev/null http://127.0.0.1:8788 && break
          done
          SMOKE_BASE_URL=http://127.0.0.1:8788 npm run test:headers
          pkill -f "wrangler dev" || true

  browser:
    name: browser — isolation + engine (FR-7, US-C1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # prebuild stages the GPLv3 engine artifacts into public/engine.
      - name: Build
        run: npm run build
      # Mobile-first (D-08): 360 px is the baseline viewport, not an extra.
      - name: Browser tests (360 px)
        run: npm run test:browser:mobile

      - name: Browser tests (desktop)
        run: npx playwright test --project=desktop-1280

  guardrails:
    name: project hard rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # One implementation, called from both CI and .githooks/pre-commit.
      # Inlining these checks here as well produced two copies that agreed only
      # until one was edited — and the copy that silently stopped matching is
      # the one that stops catching anything.
      #
      # Covers NFR-L3 (no GPL board libraries), NFR-L1 (no live-game surfaces),
      # FR-7 (COOP/COEP still declared) and NFR-S1 (no secrets staged).
      - name: Project hard rules
        run: bash scripts/guardrails.sh
